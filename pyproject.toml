[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sonar-sim"
version = "0.1.0"
description = "Synthetic passive-SONAR ULA data generation and DOA classifiers"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
]

[project.optional-dependencies]
train = [
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "h5py>=3.10",
    "scikit-learn>=1.3",
    "tqdm>=4.66",
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8",
]

[project.scripts]
sonar-generate = "sonar_sim.generation.cli:main"
sonar-train    = "sonar_sim.training.cli:main"

[tool.setuptools.packages.find]
include = ["sonar_sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# ---------------------------------------------------------------------------
# uv configuration
# ---------------------------------------------------------------------------
[tool.uv]
# torch cu121 wheels are not on PyPI — point uv at the PyTorch index
# so it can resolve torch/torchaudio without a manual --index-url each time.

[tool.uv.sources]
torch      = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url  = "https://download.pytorch.org/whl/cu121"
explicit = true          # only use this index for torch/torchaudio
